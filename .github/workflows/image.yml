name: Publish reviewed image

# Manual publication only. Review the selected commit before dispatching.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'prateekmulye/counterparty-review' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/prateekmulye/counterparty-review
      POSTGRES_IMAGE: postgres:17.11-bookworm@sha256:7bade6d532592ca8ce7ee32def7399dad2607c4ea5583839fc4352a095a11ea6
    steps:
      - name: Check out selected commit
        # actions/checkout v6.1.0; verified against the official repository tag.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Build native Linux image
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:$GITHUB_SHA" .

      - name: Verify native runtime before publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          docker pull --platform linux/amd64 "$POSTGRES_IMAGE"
          python3 -B tests/check_runtime.py \
            --app-image "$IMAGE:$GITHUB_SHA" \
            --postgres-image "$POSTGRES_IMAGE" \
            --output "$RUNNER_TEMP/counterparty-runtime.json"

      - name: Report sanitized runtime receipt
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/counterparty-runtime.json"; then
            cat "$RUNNER_TEMP/counterparty-runtime.json"
          else
            printf '%s\n' '{"passed":false,"receipt":"unavailable; runtime gate did not complete"}'
          fi

      - name: Publish commit tag and report immutable digest
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/ghcr.XXXXXX")
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          unset GHCR_TOKEN
          docker push "$IMAGE:$GITHUB_SHA"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")
          [[ "$digest" == "$IMAGE"@sha256:* ]]
          [[ "${digest##*@sha256:}" =~ ^[0-9a-f]{64}$ ]]
          printf 'Published %s\n' "$digest"
          printf 'Image: `%s`\n\nCommit: `%s`\n' "$digest" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
